# Tests and builds Neutron Manager on every push and pull request.
# Creating a release with a new tag like v1.0.0 also attaches the .exe and its SHA-256 to it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      EXE_NAME: Neutron Manager
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build the .exe
        run: python -m PyInstaller --onefile --windowed --name "$env:EXE_NAME" --icon "assets\icon.ico" --add-data "assets\icon.ico;assets" --add-data "assets\fonts;assets\fonts" --collect-data customtkinter --collect-data libusb_package main.py

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\$env:EXE_NAME.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:EXE_NAME.exe" | Out-File dist\SHA256.txt -Encoding ascii
          Get-Content dist\SHA256.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Neutron-Manager
          path: |
            dist/*.exe
            dist/SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256.txt
          generate_release_notes: true
